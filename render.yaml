# The public demo. One web service on Render's free plan, built from the same Dockerfile
# as the cluster image, against a Postgres that lives elsewhere (Neon's free tier) because
# Render's own free database is deleted after thirty days and a ledger that forgets its
# book on a timer demonstrates nothing.
services:
  - type: web
    name: settletrust-ledger
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Readiness, not liveness: the platform should route to this only once it can reach
    # its database, which is the same reason the cluster manifest splits them.
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false
    envVars:
      - key: LEDGER_JDBC_URL
        sync: false
      - key: LEDGER_DB_USER
        sync: false
      - key: LEDGER_DB_PASSWORD
        sync: false
      # Generated by Render and never committed. Without it the write endpoints would be
      # open to anyone who finds the URL.
      - key: LEDGER_API_WRITE_KEY
        generateValue: true
      # A free database takes a handful of connections, not sixteen.
      - key: LEDGER_DB_POOL_SIZE
        value: "4"
      # The free instance has 512 MB. The serial collector and a smaller heap share keep
      # the JVM's own overhead inside that, so the platform does not kill it mid-request.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"
