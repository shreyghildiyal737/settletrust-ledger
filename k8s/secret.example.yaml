# An example, not a secret. Copy it, fill it in, and keep the copy out of git.
#
# In anything real these values come from the cluster's secret manager rather than from a
# file: External Secrets, Vault, or the cloud provider's own. A base64 string in a
# repository is an unencrypted password with an extra step, and the point of checking
# this file in is to say so where somebody will read it.
apiVersion: v1
kind: Secret
metadata:
  name: settletrust-ledger-db
type: Opaque
stringData:
  username: CHANGE_ME
  password: CHANGE_ME
