spring:
  application:
    name: settletrust-ledger

  datasource:
    url: ${LEDGER_JDBC_URL:jdbc:postgresql://localhost:5432/settletrust_ledger}
    username: ${LEDGER_DB_USER:postgres}
    password: ${LEDGER_DB_PASSWORD:postgres}
    hikari:
      pool-name: settletrust-ledger
      # Each transfer holds a row lock for the length of its transaction, so a caller
      # waiting on a busy account should be waiting on the lock, not on the pool.
      maximum-pool-size: 16

  flyway:
    enabled: true
    locations: classpath:db/migration

ledger:
  # The on-chain rail, off unless a node is configured. Nothing here has a default: the
  # beans hang off rpc-url being set at all, so an empty default would switch the rail on
  # and then fail at startup for want of an address.
  #
  #   LEDGER_CHAIN_RPC_URL         an Ethereum JSON-RPC endpoint
  #   LEDGER_CHAIN_ESCROW_ADDRESS  the deployed InvoiceEscrow
  #   LEDGER_CHAIN_TOKEN_ADDRESS   the ERC-20 it settles in
  #   LEDGER_CHAIN_CURRENCY        the ledger's code for that token, e.g. USDC. Configured
  #                                rather than read from the token, because a token reports
  #                                its own symbol and anyone can deploy one calling itself
  #                                USDC.
  # They are deliberately absent from this file rather than given an empty default. A
  # placeholder default registers the property as present-but-null, which is enough for
  # the condition to fire and the beans to be built with nothing in them. Left out
  # entirely, the property does not exist until the environment variable does, and Spring
  # maps LEDGER_CHAIN_RPC_URL onto ledger.chain.rpc-url on its own.
  chain:
    # How deep a deposit must be before its money is credited. Twelve is the usual
    # mainnet answer; a chain with finality wants a different number and a local one
    # wants a smaller.
    confirmations: ${LEDGER_CHAIN_CONFIRMATIONS:12}
    # How often the chain is read. Shorter than a block time buys nothing.
    poll-interval: ${LEDGER_CHAIN_POLL_INTERVAL:PT15S}
    # The block the escrow was deployed in. Nothing below it can hold a deposit into a
    # contract that did not exist, and a watcher starting with an empty cursor would
    # otherwise ask for every log since genesis: refused outright by a hosted provider,
    # and slow enough on a node of your own to look like a hang. Zero is right only for a
    # chain created for the occasion.
    deployed-at-block: ${LEDGER_CHAIN_DEPLOYED_AT_BLOCK:0}
    # The widest range one eth_getLogs may cover. Ten thousand is the usual provider cap.
    max-block-span: ${LEDGER_CHAIN_MAX_BLOCK_SPAN:10000}

  reconciliation:
    # Off only for tests that share a database with other tests, where a background run
    # would reconcile somebody else's half-built fixtures.
    enabled: ${LEDGER_RECONCILIATION_ENABLED:true}
    # Long enough that a run is never queued behind the last one, short enough that a
    # discrepancy is found in the same shift it was created.
    interval: ${LEDGER_RECONCILIATION_INTERVAL:PT15M}
    initial-delay: ${LEDGER_RECONCILIATION_INITIAL_DELAY:PT1M}
    # How stale the last full pass may get before the next run re-derives the book
    # instead of reconciling its window. Every incremental verdict in between rests on
    # totals a previous run wrote down, and this is how often anything checks them.
    deep-interval: ${LEDGER_RECONCILIATION_DEEP_INTERVAL:PT24H}

management:
  endpoints:
    web:
      exposure:
        # Health for the orchestrator, metrics for whatever decides what is worth an
        # alert. Everything else actuator can expose is either useless to both or
        # something that should not be reachable from inside the cluster without a reason.
        include: health,prometheus
  prometheus:
    metrics:
      export:
        # Stated rather than left to the default, which resolves false here: without this
        # the registry is never built, the scrape endpoint 404s, and every alert written
        # against these names silently never fires. A rule that cannot fire looks exactly
        # like a rule that is passing.
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness deliberately excludes the database. A pod that cannot reach Postgres
        # is not broken, the database is, and restarting every replica in a loop while it
        # recovers turns an outage into a worse one.
        liveness:
          include: livenessState
        # Readiness includes it, because a replica that cannot reach Postgres cannot
        # serve a request and should be taken out of the load balancer until it can.
        readiness:
          include: readinessState,db
      show-details: never

server:
  port: ${PORT:8080}
  error:
    # Errors are answered by LedgerErrorHandler, which returns a reason a client can
    # branch on. Spring's default whitelabel body would leak class names instead.
    include-message: never

logging:
  level:
    org.jooq.tools.LoggerListener: ${SQL_LOG_LEVEL:warn}
