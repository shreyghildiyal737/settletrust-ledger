# The Solidity half of the project. The Java service never builds this: the contract is
# compiled and deployed by hand, or by the one command in the README, and the Java tests
# reach a chain that is already running. Wiring a Solidity toolchain into `mvn test` would
# make every unit test depend on a compiler none of them need.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# Matches the pragma in InvoiceEscrow.sol rather than floating with whatever forge ships.
# A contract that holds money should be compiled by a version somebody chose.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
